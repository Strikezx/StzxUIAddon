name: Lint and test

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Luacheck
        run: luacheck .

      - name: Offline test harness
        run: lua5.1 tests/harness.lua
